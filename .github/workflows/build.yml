name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: 'mobile/package-lock.json'

    - name: Install mobile dependencies
      run: npm ci
      working-directory: mobile

    - name: Make build script executable
      run: chmod +x scripts/build-${{ github.event.inputs.build_type }}.sh

    - name: Build APK (${{ github.event.inputs.build_type }})
      run: scripts/build-${{ github.event.inputs.build_type }}.sh
      env:
        SKIP_RELEASE_UPLOAD: 'true'
      continue-on-error: true

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: apk-${{ github.event.inputs.build_type }}
        path: test-builds/**/*.apk
        retention-days: 30
      continue-on-error: true

