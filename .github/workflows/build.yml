name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Load environment variables
      run: |
        if [ -f .env ]; then
          cat .env >> $GITHUB_ENV
        fi
        if [ -f mobile/.env ]; then
          cat mobile/.env >> $GITHUB_ENV
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: 'mobile/package-lock.json'

    - name: Install mobile dependencies
      run: npm ci
      working-directory: mobile

    - name: Run Expo prebuild
      run: npx expo prebuild -p android --no-install
      working-directory: mobile
      continue-on-error: true

    - name: Make build script executable
      run: chmod +x scripts/build-${{ github.event.inputs.build_type }}.sh

    - name: Build APK (${{ github.event.inputs.build_type }})
      run: scripts/build-${{ github.event.inputs.build_type }}.sh
      env:
        SKIP_RELEASE_UPLOAD: 'true'
      continue-on-error: true

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk-${{ github.event.inputs.build_type }}
        path: test-builds/**/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Post workflow result as comment (if on PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Build workflow completed. Artifacts available in workflow run.'
          })
      continue-on-error: true
